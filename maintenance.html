<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GroupForge | Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;
            --gray-50: #f9fafb;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .maintenance-card {
            background: var(--white);
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 3rem 2rem;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .maintenance-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #eef2ff 0%, var(--white) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .maintenance-icon svg {
            width: 44px;
            height: 44px;
            stroke: var(--indigo-600);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--gray-600);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .progress-bar {
            background: #e5e7eb;
            border-radius: 50px;
            height: 6px;
            overflow: hidden;
            margin: 1.5rem 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--indigo-600), var(--indigo-700));
            width: 45%;
            height: 100%;
            border-radius: 50px;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; width: 45%; }
            50% { opacity: 1; width: 55%; }
            100% { opacity: 0.7; width: 45%; }
        }

        .status-badge {
            display: inline-block;
            background: #eef2ff;
            color: var(--indigo-600);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--indigo-600);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 1rem;
        }

        .social-links {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .social-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--indigo-600);
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="status-badge"> Scheduled Maintenance</div>
        <div class="maintenance-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 8V12M12 16H12.01M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>Under Maintenance</h1>
        <p>We're currently improving GroupForge to serve you better. The site will be back shortly.</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <p style="font-size: 0.75rem; color: #9ca3af; margin-top: 0.5rem;">
            Estimated completion: <strong>Q2 2026</strong>
        </p>
        
        <a href="javascript:location.reload()" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            Check again
        </a>
        
        <div class="social-links">
            <a href="mailto:support@groupforge.com">Email</a>
            <a href="#">Twitter</a>
            <a href="#">GitHub</a>
        </div>
    </div>
</body>
</html>
